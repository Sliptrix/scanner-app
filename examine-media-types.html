<!DOCTYPE html>
<html>
<head>
    <title>Media Types Excel Examiner</title>
</head>
<body>
    <h1>Media Types Excel File Examination</h1>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <div id="output"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    let output = '<h2>Sheet Names:</h2>';
                    output += '<ul>' + workbook.SheetNames.map(name => `<li>${name}</li>`).join('') + '</ul>';
                    
                    workbook.SheetNames.forEach(sheetName => {
                        output += `<h2>Sheet: ${sheetName}</h2>`;
                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        output += '<table border="1" style="border-collapse: collapse; margin: 10px 0;">';
                        jsonData.slice(0, 20).forEach((row, index) => {
                            if (row.length > 0) {
                                output += '<tr>';
                                row.forEach(cell => {
                                    output += `<td style="padding: 5px;">${cell || ''}</td>`;
                                });
                                output += '</tr>';
                            }
                        });
                        output += '</table>';
                        
                        // Also show as JSON for easier analysis
                        const jsonWithHeaders = XLSX.utils.sheet_to_json(worksheet);
                        output += '<h3>JSON Format (first 10 rows):</h3>';
                        output += '<pre>' + JSON.stringify(jsonWithHeaders.slice(0, 10), null, 2) + '</pre>';
                    });
                    
                    document.getElementById('output').innerHTML = output;
                } catch (error) {
                    document.getElementById('output').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
