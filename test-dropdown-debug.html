<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        .results {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-family: monospace;
        }
        .flex-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Dropdown Functionality Debug Test</h1>
        <p>This page tests the dropdown functionality in isolation to identify issues.</p>
        
        <div class="form-group">
            <label for="recipeBasalSalt">Basal Salt:</label>
            <div class="flex-container">
                <select id="recipeBasalSalt" class="form-control" style="flex: 1;" onchange="updateBasalSaltAmount()">
                    <option value="M&S" selected>M&S</option>
                    <option value="DKW">DKW</option>
                </select>
                <input type="number" id="recipeBasalSaltAmount" class="form-control" style="width: 100px;" step="0.01" /> 
                <span>g</span>
            </div>
        </div>

        <div class="form-group">
            <label for="recipeGellingAgent">Gelling Agent:</label>
            <div class="flex-container">
                <select id="recipeGellingAgent" class="form-control" style="flex: 1;" onchange="updateGellingAgentAmount()">
                    <option value="Phytogel" selected>Phytogel</option>
                    <option value="Agar">Agar</option>
                </select>
                <input type="number" id="recipeGellingAgentAmount" class="form-control" style="width: 100px;" step="0.01" />
                <span>g</span>
            </div>
        </div>

        <div class="form-group">
            <label for="recipeVolume">Volume:</label>
            <select id="recipeVolume" class="form-control" onchange="updateAllAmounts()">
                <option value="500mL">500mL</option>
                <option value="1L" selected>1L</option>
                <option value="2L">2L</option>
            </select>
        </div>

        <button onclick="populateRecommendedValues()">🔄 Populate Recommended Values</button>
        <button onclick="testBasicDropdowns()">🧪 Test Basic Dropdowns</button>

        <div class="results" id="results">
            Test results will appear here...
        </div>
    </div>

    <script>
        // Define recommended amounts for different basal salts (per 1L)
        const BASAL_SALT_AMOUNTS = {
            'M&S': 4.4,
            'DKW': 3.9
        };

        // Define recommended amounts for different gelling agents (per 1L)
        const GELLING_AGENT_AMOUNTS = {
            'Phytogel': 2.3,
            'Agar': 8.0
        };

        // Define volume scales
        const VOLUME_SCALES = {
            '500mL': 0.5,
            '1L': 1.0,
            '2L': 2.0
        };

        function log(message) {
            const results = document.getElementById('results');
            results.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            console.log(message);
        }

        function updateBasalSaltAmount() {
            log('updateBasalSaltAmount() called');
            
            const basalSaltSelect = document.getElementById('recipeBasalSalt');
            const basalSaltAmountInput = document.getElementById('recipeBasalSaltAmount');
            const volumeSelect = document.getElementById('recipeVolume');
            
            if (!basalSaltSelect || !basalSaltAmountInput || !volumeSelect) {
                log('ERROR: Missing elements');
                return;
            }
            
            const selectedType = basalSaltSelect.value;
            const volume = volumeSelect.value;
            const scale = VOLUME_SCALES[volume] || 1;
            const baseAmount = BASAL_SALT_AMOUNTS[selectedType] || 4.4;
            
            const newAmount = (baseAmount * scale).toFixed(2);
            basalSaltAmountInput.value = newAmount;
            
            // Visual feedback
            basalSaltAmountInput.style.borderColor = '#28a745';
            basalSaltAmountInput.style.backgroundColor = '#f8fff9';
            
            log(`Updated basal salt: ${selectedType} -> ${newAmount}g (volume: ${volume}, scale: ${scale})`);
        }

        function updateGellingAgentAmount() {
            log('updateGellingAgentAmount() called');
            
            const gellingAgentSelect = document.getElementById('recipeGellingAgent');
            const gellingAgentAmountInput = document.getElementById('recipeGellingAgentAmount');
            const volumeSelect = document.getElementById('recipeVolume');
            
            if (!gellingAgentSelect || !gellingAgentAmountInput || !volumeSelect) {
                log('ERROR: Missing elements');
                return;
            }
            
            const selectedType = gellingAgentSelect.value;
            const volume = volumeSelect.value;
            const scale = VOLUME_SCALES[volume] || 1;
            const baseAmount = GELLING_AGENT_AMOUNTS[selectedType] || 2.3;
            
            const newAmount = (baseAmount * scale).toFixed(2);
            gellingAgentAmountInput.value = newAmount;
            
            // Visual feedback
            gellingAgentAmountInput.style.borderColor = '#28a745';
            gellingAgentAmountInput.style.backgroundColor = '#f8fff9';
            
            log(`Updated gelling agent: ${selectedType} -> ${newAmount}g (volume: ${volume}, scale: ${scale})`);
        }

        function updateAllAmounts() {
            log('updateAllAmounts() called');
            updateBasalSaltAmount();
            updateGellingAgentAmount();
        }

        function populateRecommendedValues() {
            log('Populating recommended values...');
            
            // Set defaults
            document.getElementById('recipeBasalSalt').value = 'M&S';
            document.getElementById('recipeGellingAgent').value = 'Phytogel';
            document.getElementById('recipeVolume').value = '1L';
            
            // Update amounts
            updateAllAmounts();
            
            log('Recommended values populated');
        }

        function testBasicDropdowns() {
            log('Testing basic dropdown functionality...');
            
            const basalSaltSelect = document.getElementById('recipeBasalSalt');
            const gellingAgentSelect = document.getElementById('recipeGellingAgent');
            
            log(`Basal salt options: ${Array.from(basalSaltSelect.options).map(o => o.value).join(', ')}`);
            log(`Gelling agent options: ${Array.from(gellingAgentSelect.options).map(o => o.value).join(', ')}`);
            
            // Test programmatic changes
            log('Testing programmatic selection...');
            basalSaltSelect.value = 'DKW';
            updateBasalSaltAmount();
            
            gellingAgentSelect.value = 'Agar';
            updateGellingAgentAmount();
            
            log('Programmatic test complete');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            log('Page loaded, initializing...');
            populateRecommendedValues();
            log('Ready for testing');
        });
    </script>
</body>
</html>
